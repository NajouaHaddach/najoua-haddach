
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci pour votre message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fc;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .thank-you {
            background: white;
            padding: 50px 30px;
            border-radius: 18px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .check {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 13px 28px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
        }

        a:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="thank-you">
        <div class="check">✓</div>
        <h1>Merci pour votre message !</h1>

        <p>
            Votre message a bien été envoyé.<br>
            Je vous répondrai dans les plus brefs délais.
        </p>

        <a href="index.html">Retour à l'accueil</a>
    </div>

</body>
</html>
